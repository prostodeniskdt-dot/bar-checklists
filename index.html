<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Чек-листы бара</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css"/>

  <!-- jsPDF + html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-main">BAR CONTROL</span>
        <span class="logo-sub">checklists</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-checklist="opening">Открытие смены</button>
        <button class="nav-item" data-checklist="day">В течение дня</button>
        <button class="nav-item" data-checklist="closing">Закрытие смены</button>
        <button class="nav-item" data-checklist="prep">Заготовочный цех</button>
      </nav>

      <div class="sidebar-footer">
        <small>Версия 1.4</small>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="title-block">
          <h1 id="checklist-title">Чек-лист</h1>
          <p id="checklist-subtitle" class="subtitle">Выберите нужный чек-лист слева и отмечайте пункты.</p>
          <div class="meta-row">
            <span id="user-badge" class="badge">Гость</span>
            <span id="session-info" class="muted"></span>
          </div>
        </div>

        <div class="actions">
          <button id="login-btn" class="btn btn-secondary">Войти</button>
          <button id="start-btn" class="btn btn-start hidden">Начать</button>
          <span id="timer" class="timer hidden">01:00:00</span>
          <button id="export-btn" class="btn btn-primary">Поделиться отчётом</button>
        </div>
      </header>

      <section class="content">
        <div id="checklist-container" class="checklist-container"></div>
      </section>
    </main>
  </div>

  <!-- Печатная область -->
  <div id="print-area" class="print-area"></div>

  <!-- Модал авторизации -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Вход</h3>
      <label class="field">
        <span>Имя</span>
        <input type="text" id="auth-name" placeholder="Иван Иванов"/>
      </label>
      <label class="field">
        <span>Роль</span>
        <select id="auth-role">
          <option value="Сотрудник">Сотрудник</option>
          <option value="Бар-менеджер">Бар-менеджер</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="auth-cancel" class="btn btn-secondary">Отмена</button>
        <button id="auth-ok" class="btn btn-primary">Войти</button>
      </div>
    </div>
  </div>

  <!-- Модал камеры -->
  <div id="camera-modal" class="modal hidden">
    <div class="modal-card camera-card">
      <h3>Камера</h3>
      <div class="camera-box">
        <video id="cam-video" autoplay playsinline></video>
        <canvas id="cam-canvas" class="hidden"></canvas>
      </div>
      <div class="modal-actions">
        <button id="cam-switch" class="btn btn-secondary" title="Переключить камеру">↺</button>
        <button id="cam-cancel" class="btn btn-secondary">Отмена</button>
        <button id="cam-shoot" class="btn btn-primary">Сделать фото</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"><span id="toast-message"></span></div>
</body>
</html>
